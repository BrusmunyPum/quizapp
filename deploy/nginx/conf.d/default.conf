# ===================================================
# GlassQuiz Gateway
# Upstreams are resolved via Docker DNS on every request so container rebuilds never leave stale 502s.
# ===================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    # 1. Gateway health check
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"glassquiz-gateway","timestamp":"$time_iso8601"}\n';
    }

    # 2. Live Quiz WebSockets (Socket.IO)
    location /socket.io/ {
        set $api_upstream "http://api:3000";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 3. Host sign in / register: rate-limit brute force attempts
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth_rate_limit burst=10 nodelay;
        limit_req_status 429;

        set $api_upstream "http://api:3000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 4. REST API (/api/* -> NestJS /*)
    location /api/ {
        limit_req zone=api_rate_limit burst=60 nodelay;
        limit_req_status 429;
        limit_conn addr_limit 30;

        set $api_upstream "http://api:3000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 5. Vue SPA frontend (all other routes)
    location / {
        set $web_upstream "http://web:80";
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
